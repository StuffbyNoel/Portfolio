<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stuffbynoel | Portfolio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'jersey': ['"Jersey 10"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Font Face -->
    <style>
        @font-face {
            font-family: 'Jersey 10';
            src: url('Jersey10-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        body {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body class="font-jersey h-screen w-screen overflow-hidden flex flex-col bg-black text-white selection:bg-white selection:text-black">

    <!-- Navigation Header -->
    <header class="fixed top-0 left-0 w-full p-6 md:p-8 flex justify-between items-center z-50">
        <div class="text-2xl md:text-4xl tracking-widest hover:opacity-75 transition-opacity cursor-pointer">
            stuffbynoel
        </div>
        <div class="text-2xl md:text-4xl tracking-widest">
            2026
        </div>
    </header>

    <!-- Hero Section (Centered Name) -->
    <main class="flex-1 flex items-center justify-center px-4">
        <h1 class="text-7xl md:text-9xl lg:text-[10rem] tracking-widest uppercase text-center leading-none">
            Noel Mathew
        </h1>
    </main>

</body>
</html>
